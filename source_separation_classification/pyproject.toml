[project]
name = "source-separation-classification"
version = "1.0.0"
description = "Respiratory phase classification for the four-microphone wearable stethoscope"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmapy>=0.6.6",
    "librosa>=0.11",
    "matplotlib>=3.8,<3.9",  # cmapy needs matplotlib.cm.get_cmap (removed in 3.9)
    "numpy>=2.0",
    "opencv-python>=4.10",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tensorboard>=2.18",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.66",
]
