# Bluetooth
CONFIG_BT=y
CONFIG_BT_DEBUG_LOG=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_BAS=y
CONFIG_BT_HRS=y
CONFIG_BT_DEVICE_NAME="APNEA_V1"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_CONN_TX_MAX=255
CONFIG_BT_L2CAP_TX_BUF_COUNT=255
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_COUNT=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_PRIVACY=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
#CONFIG_BT_LOG_SNIFFER_INFO=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
#CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=300
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_SLAVE_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Utilities
CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
CONFIG_LOG_BUFFER_SIZE=32768

# Larger system workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=32768

# On chip peripheral
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_GPIO=y
CONFIG_ADC=n
#CONFIG_BT_LL_SW_SPLIT=n
CONFIG_I2C=y

# Sensor drivers
CONFIG_SENSOR=y		# sensor API used by the MAX32664 driver
CONFIG_MAX32664=y
CONFIG_KX132=n
CONFIG_NORDIC_ADC=y

# Application libraries
CONFIG_DATA_BLE=y
CONFIG_APP_MIC=y
CONFIG_APP_PPG=y
# Enable when we want to do the packet assembly in the application
CONFIG_APP_DATA=y

# nRFx drivers
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_TIMER1=y
CONFIG_NRFX_PPI=y
CONFIG_NRFX_GPIOTE=y
CONFIG_NRFX_TWI=y 	# Set to y to enable nrfx TWI driver
# Enable TWI instance 0 and/or instance 1.
# At least one must be enabled. See nrfx_twi.c for more info.
CONFIG_NRFX_TWI0=y 	# Set to y to enable nrfx TWI0 instance
CONFIG_NRFX_TWI1=y 	# Set to y to enable nrfx TWI1 instance





