[project]
name = "host-software"
version = "1.0.0"
description = "BLE host software for recording the four-microphone wearable stethoscope"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
    "matplotlib>=3.10",
    "numpy>=2.5.1",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "soundfile>=0.14.0",
    "winrt-windows-devices-radios>=3.2.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
